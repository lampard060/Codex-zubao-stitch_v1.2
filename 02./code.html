<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface-variant": "#3f4943",
                    "on-background": "#1c1b1d",
                    "surface-bright": "#fcf8fb",
                    "primary-fixed": "#9df4c8",
                    "on-primary": "#ffffff",
                    "secondary-fixed-dim": "#4edea3",
                    "primary": "#005136",
                    "secondary": "#006c49",
                    "error": "#ba1a1a",
                    "primary-container": "#006c49",
                    "primary-fixed-dim": "#81d8ad",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed": "#002113",
                    "tertiary": "#005136",
                    "secondary-fixed": "#6ffbbe",
                    "error-container": "#ffdad6",
                    "inverse-primary": "#81d8ad",
                    "on-tertiary": "#ffffff",
                    "on-error": "#ffffff",
                    "background": "#fcf8fb",
                    "tertiary-fixed": "#6ffbbe",
                    "tertiary-fixed-dim": "#4fdea4",
                    "secondary-container": "#6cf8bb",
                    "surface-tint": "#006c49",
                    "surface-variant": "#e5e1e4",
                    "outline": "#6f7a72",
                    "on-tertiary-container": "#64f1b5",
                    "on-primary-fixed-variant": "#005236",
                    "outline-variant": "#bec9c0",
                    "tertiary-container": "#006c4a",
                    "surface-container-low": "#f6f2f5",
                    "on-tertiary-fixed": "#002114",
                    "surface-container-highest": "#e5e1e4",
                    "on-primary-fixed": "#002113",
                    "surface-container-lowest": "#ffffff",
                    "inverse-surface": "#313032",
                    "surface-dim": "#dcd9dc",
                    "on-error-container": "#93000a",
                    "surface-container-high": "#ebe7ea",
                    "inverse-on-surface": "#f3f0f3",
                    "surface": "#fcf8fb",
                    "on-secondary-fixed-variant": "#005236",
                    "on-primary-container": "#93eabe",
                    "on-tertiary-fixed-variant": "#005237",
                    "on-surface": "#1c1b1d",
                    "on-secondary-container": "#00714d",
                    "surface-container": "#f1edf0",
                    "amber-accent": "#d97706"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #fcf8fb; }
        .font-headline { font-family: 'Manrope', sans-serif; }
        .glass-panel {
            background: rgba(252, 248, 251, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .role-tab.active {
            color: #005136;
            border-bottom: 2px solid #005136;
        }
        .role-tab:not(.active) {
            color: #6f7a72;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-4 md:p-8 overflow-hidden relative">
<!-- Background Art -->
<div class="fixed inset-0 z-0">
<img alt="serene high-end spa background" class="w-full h-full object-cover grayscale-[20%] opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDi3NKD6i4NL-QdDDlO0AJamzBNPy-DkStSULPETP3P7tqBL1sCsPUYHz5iqabmTcxuZgKFwEXii48mgKZJh2OiWdzYJIA96PHsxdwqHu01n7SMPit-XlQinDnA602jyS3NqXE5Xep9xIBQqlKj6yx4ZY8V-nCXwmAkO3qUDqK8PZjLMwr5GtS4a6dqX9Km2ad16FdyfTLKzWfeMwS8RK6K3eYSEWouPrkJ8uIFc4gOBUW_H_uynvtC7iQbMMPrgtTE6kuyG8JDito"/>
<div class="absolute inset-0 bg-gradient-to-tr from-surface/40 via-transparent to-surface/20"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-[1100px] grid md:grid-cols-2 shadow-2xl rounded-xl overflow-hidden glass-panel border border-white/20">
<!-- Left Side: Editorial Brand Image & Slogan -->
<div class="hidden md:flex flex-col justify-end p-12 relative overflow-hidden group">
<div class="absolute inset-0 z-0">
<img alt="natural textures" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8nTT1loM_TQyjj9mMyfY-Yvd9v-4zqZ8O4F5G0d4br10efr1kcXkfwjKyApn2oUGkvCe6AbkTxVlqMF1LPibDMD5MFT4xX4T4LZNkSu_dAgxOEPTwpqfGjp0oGDi32M8TWDcuZYwJO3uK2KJffGGwOS8Z148Fd1K_4pR1i6yeasaTHBcfyDHWZkxWPkxxZnqnDxswvFNcN6BOgV_q3tYbvnhOY3xKdpns2iwaIQuJg1O7b0-N3UGXYir6A55p2_ZC5qJLaIewt1aK"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/80 via-primary/20 to-transparent"></div>
</div>
<div class="relative z-10">
<p class="text-secondary-fixed font-headline font-bold text-sm tracking-[0.2em] uppercase mb-4">The Digital Sanctuary</p>
<h1 class="text-white font-headline text-5xl font-extrabold tracking-tighter leading-tight mb-6">
                    重拾身心<br/>平衡之美
                </h1>
<p class="text-white/80 max-w-xs font-body text-sm leading-relaxed">在 ZuBao，我们将传统足道智慧与现代数字化管理融合，为您营造极致的宁静体验。</p>
</div>
</div>
<!-- Right Side: Interaction Form -->
<div class="p-8 md:p-12 flex flex-col justify-center bg-white/40 backdrop-blur-sm">
<!-- Brand Logo -->
<div class="flex items-center gap-3 mb-8">
<div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<span class="font-headline font-black text-2xl tracking-tighter text-primary">ZuBao</span>
</div>
<!-- Role Tabs -->
<div class="flex border-b border-outline-variant/30 mb-8">
<button class="role-tab active px-4 py-3 text-sm font-bold tracking-wide transition-all border-b-2" onclick="switchRole(this)">商家端</button>
<button class="role-tab px-4 py-3 text-sm font-bold tracking-wide transition-all border-b-2 border-transparent" onclick="switchRole(this)">技师端</button>
<button class="role-tab px-4 py-3 text-sm font-bold tracking-wide transition-all border-b-2 border-transparent" onclick="switchRole(this)">消费者端</button>
</div>
<div class="mb-6">
<h2 class="text-2xl font-headline font-extrabold text-on-surface tracking-tight mb-1">欢迎归来</h2>
<p class="text-on-surface-variant font-body text-xs">请选择身份并输入凭据以进入数字化空间</p>
</div>
<!-- Form -->
<form class="space-y-5">
<!-- Username -->
<div class="space-y-1.5">
<label class="block text-[10px] font-bold text-primary tracking-widest uppercase ml-4">账号 / 手机号</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest/80 border-0 rounded-full px-6 py-3.5 text-sm text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/20 transition-all" placeholder="输入您的手机号" type="text"/>
<span class="material-symbols-outlined absolute right-6 top-1/2 -translate-y-1/2 text-outline-variant text-lg">smartphone</span>
</div>
</div>
<!-- Password / Verification -->
<div class="space-y-1.5">
<div class="flex justify-between items-center px-4">
<label class="block text-[10px] font-bold text-primary tracking-widest uppercase">登录密码</label>
<a class="text-[10px] text-on-surface-variant hover:text-primary transition-colors" href="#">忘记密码？</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest/80 border-0 rounded-full px-6 py-3.5 text-sm text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/20 transition-all" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-6 top-1/2 -translate-y-1/2 text-outline-variant text-lg">lock</span>
</div>
</div>
<!-- CTA Button -->
<button class="w-full bg-gradient-to-r from-amber-accent to-orange-500 text-white font-headline font-bold py-3.5 rounded-full shadow-lg shadow-amber-accent/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-6" type="submit">
                    登录 / 开启体验
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions -->
<div class="mt-8 space-y-6">
<div class="relative flex items-center justify-center">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant/30"></div></div>
<span class="relative bg-transparent px-4 text-[10px] text-on-surface-variant font-medium">其他方式登录</span>
</div>
<div class="flex justify-center gap-4">
<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center hover:bg-surface-container-high transition-colors">
<img alt="WeChat Login" class="w-4 h-4 opacity-70" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB0igwYVyJ0vmVxqZD261Im7L_r71z6HX8gZuWb_DE4iraextenuwO5x5Y6mL5xEvSj3-Qjseue91KvP70_LSmwOLl1b_PGjwG2qnOtNzO0_fj7ya0vr9vi2pZMg6L9MpkGnGGQtwT1TeawCCsgjg_JQ1NdWo5V0f8gabisaLEPq58wAW0NNa5coMKNovWEZTyXcktdveogeT3aBTTgfh-Vc5MhEeT9EyL8zxZxnOYxA_UT5a7o4azzDHEqFKGWN0oc33qCp2wvlEUd"/>
</button>
<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-lg">qr_code_scanner</span>
</button>
</div>
<p class="text-center text-xs text-on-surface-variant mt-6">
                    还没有账号？ 
                    <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4 transition-all" href="#">立即注册</a>
</p>
</div>
</div>
</main>
<script>
    function switchRole(element) {
        document.querySelectorAll('.role-tab').forEach(tab => {
            tab.classList.remove('active', 'border-primary');
            tab.classList.add('border-transparent');
        });
        element.classList.add('active');
        element.classList.remove('border-transparent');
    }
</script>
<!-- Footer Copyright -->
<footer class="fixed bottom-6 w-full text-center z-10 px-4">
<p class="text-[10px] text-on-surface/40 font-medium tracking-[0.3em] uppercase">© 2024 ZuBao • Designed for Absolute Tranquility</p>
</footer>
</body></html>
