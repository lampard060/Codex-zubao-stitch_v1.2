<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>足宝 | 订单中心</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles.css?v=20260428a" />
  </head>
  <body data-page="merchant-orders">
    <div class="app-shell merchant-mobile-shell">
      <main class="main-panel merchant-mobile-main">
        <header class="topbar merchant-mobile-topbar">
          <div class="merchant-mobile-titlebar">
            <img class="merchant-mobile-logo-badge" src="./zubao-tech-icon.png" alt="足宝图标" />
            <h1 class="merchant-mobile-title">订单中心</h1>
          </div>

        </header>

        <section class="mobile-date-nav" id="orders-date-nav">
          <button class="mobile-date-nav-btn" type="button" id="orders-date-prev" aria-label="前一天">
            <span class="material-symbols-outlined">chevron_left</span>
          </button>
          <div class="mobile-date-nav-center" onclick="window.__zubaoOpenDatePicker&&window.__zubaoOpenDatePicker()">
            <span class="mobile-date-nav-label" id="orders-date-label">今天</span>
            <input type="date" id="orders-date-picker" class="mobile-date-nav-picker" />
          </div>
          <button class="mobile-date-nav-btn" type="button" id="orders-date-next" aria-label="后一天">
            <span class="material-symbols-outlined">chevron_right</span>
          </button>
        </section>

        <section class="mobile-hero-card mobile-hero-card-emerald order-hero-card">
          <div class="mobile-hero-label" id="orders-hero-label">今日服务总营收</div>
          <div class="mobile-hero-amount" id="orders-total-revenue">¥--</div>
          <div class="mobile-stat-grid">
            <div>
              <span>服务中</span>
              <strong id="orders-summary-service">--</strong>
            </div>
            <div>
              <span>待服务</span>
              <strong id="orders-summary-pending">--</strong>
            </div>
            <div>
              <span>已完成</span>
              <strong id="orders-summary-completed">--</strong>
            </div>
            <div>
              <span>全部</span>
              <strong id="orders-total-count">--</strong>
            </div>
          </div>
        </section>

        <section class="mobile-tab-shell" id="orders-status-filters">
          <button class="mobile-tab-pill active" data-order-status-filter="all">全部</button>
          <button class="mobile-tab-pill" data-order-status-filter="in_service">服务中</button>
          <button class="mobile-tab-pill" data-order-status-filter="pending">待服务</button>
          <button class="mobile-tab-pill" data-order-status-filter="completed">已完成</button>
        </section>

        <section class="mobile-card-stack mobile-order-stack" id="orders-list">
          <article class="mobile-order-card">
            <div class="mobile-order-head">
              <div class="merchant-mobile-avatar theme-coral">深</div>
              <div class="mobile-order-copy">
                <h3>深层经络调理</h3>
                <p>技师: 李思 (VIP房 203)</p>
              </div>
              <span class="mobile-status-pill success">进行中</span>
            </div>
            <div class="mobile-progress-meta">
              <span>剩余时间</span>
              <strong>82 MIN</strong>
            </div>
            <div class="mobile-progress-track">
              <div class="mobile-progress-fill is-emerald" style="width: 42%"></div>
            </div>
            <div class="mobile-order-actions">
              <button class="mobile-action-button secondary" type="button" data-order-start="PLACEHOLDER">开始</button>
              <button class="mobile-action-button secondary" type="button" data-order-finish="PLACEHOLDER">结束</button>
              <button class="mobile-action-button" type="button" data-order-edit="PLACEHOLDER">加钟</button>
            </div>
            <div class="mobile-order-foot">
              <span>#ZB-9830</span>
              <span>15:30</span>
            </div>
          </article>
        </section>

        <div class="mobile-load-more" id="orders-load-more" hidden>
          <button class="mobile-load-more-btn" type="button" id="orders-load-more-btn">加载更多</button>
          <span class="mobile-load-more-info" id="orders-load-more-info"></span>
        </div>
      </main>
    </div>

    <div class="mobile-sheet-backdrop" id="orders-sheet-backdrop" hidden></div>

    <section class="mobile-bottom-sheet" id="orders-filter-panel" hidden>
      <div class="mobile-sheet-handle"></div>
      <div class="mobile-sheet-head">
        <div>
          <h2>筛选订单</h2>
          <p>按日期与关键词筛选，不改变首页结构。</p>
        </div>
        <button class="merchant-mobile-icon-button" type="button" id="orders-filter-close" aria-label="关闭筛选">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="mobile-sheet-body">
        <label class="mobile-form-field">
          <span>搜索订单</span>
          <input id="orders-search-input" placeholder="搜索订单号、技师姓名" />
        </label>
        <label class="mobile-form-field" hidden>
          <span>筛选日期</span>
          <input type="date" id="orders-date-input" />
        </label>
        <button class="mobile-sheet-primary" type="button" id="orders-create-toggle">新增上钟</button>
      </div>
    </section>

    <section class="mobile-bottom-sheet" id="orders-create-panel" hidden>
      <div class="mobile-sheet-handle"></div>
      <div class="mobile-sheet-head">
        <div>
          <h2>新增上钟</h2>
          <p>按项目、房间与客户快速开单。</p>
        </div>
        <button class="merchant-mobile-icon-button" type="button" id="orders-create-cancel" aria-label="关闭新增面板">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="mobile-sheet-body">
        <div class="mobile-form-field">
          <span>订单类型</span>
          <div class="mobile-order-type-options">
            <button class="mobile-order-type-btn active" type="button" data-order-type="queue">排钟</button>
            <button class="mobile-order-type-btn" type="button" data-order-type="direct">点钟</button>
          </div>
        </div>
        <label class="mobile-form-field">
          <span>技师</span>
          <select id="orders-create-technician"></select>
        </label>
        <label class="mobile-form-field">
          <span>项目</span>
          <select id="orders-create-service-item"></select>
        </label>
        <label class="mobile-form-field">
          <span>房间</span>
          <select id="orders-create-room"></select>
        </label>
        <label class="mobile-form-field">
          <span>客户</span>
          <select id="orders-create-customer"></select>
        </label>
        <label class="mobile-form-field">
          <span>开始时间</span>
          <input id="orders-create-start-time" type="datetime-local" />
        </label>
        <label class="mobile-form-field">
          <span>备注</span>
          <input id="orders-create-note" placeholder="例如：客户偏好轻力度" />
        </label>
        <p class="small" id="orders-create-feedback" hidden></p>
        <button class="mobile-sheet-primary" type="button" id="orders-create-submit">确认新增</button>
      </div>
    </section>

    <section class="mobile-bottom-sheet" id="orders-edit-panel" hidden>
      <div class="mobile-sheet-handle"></div>
      <div class="mobile-sheet-head">
        <div>
          <h2 id="orders-edit-title">订单管理</h2>
          <p id="orders-edit-order-no">--</p>
        </div>
        <button class="merchant-mobile-icon-button" type="button" id="orders-edit-cancel" aria-label="关闭编辑面板">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="mobile-sheet-body">
        <div class="mobile-sheet-records" id="orders-edit-records"></div>
        <label class="mobile-form-field" id="orders-edit-technician-field">
          <span>技师</span>
          <select id="orders-edit-technician"></select>
        </label>
        <label class="mobile-form-field">
          <span>项目</span>
          <select id="orders-edit-service-item"></select>
        </label>
        <label class="mobile-form-field" id="orders-edit-extend-count-field" hidden>
          <span>加钟数</span>
          <div class="extend-count-control">
            <button type="button" id="orders-edit-extend-minus" class="extend-count-btn">−</button>
            <input id="orders-edit-extend-count" type="number" value="1" min="1" max="10" />
            <button type="button" id="orders-edit-extend-plus" class="extend-count-btn">+</button>
          </div>
        </label>
        <label class="mobile-form-field" id="orders-edit-room-field">
          <span>房间</span>
          <select id="orders-edit-room"></select>
        </label>
        <label class="mobile-form-field" id="orders-edit-customer-field">
          <span>客户</span>
          <select id="orders-edit-customer"></select>
        </label>
        <label class="mobile-form-field" id="orders-edit-start-time-field">
          <span>开始时间</span>
          <input id="orders-edit-start-time" type="datetime-local" />
        </label>
        <label class="mobile-form-field" id="orders-edit-end-time-field">
          <span>结束时间</span>
          <input id="orders-edit-end-time" type="datetime-local" />
        </label>
        <label class="mobile-form-field" id="orders-edit-duration-field" hidden>
          <span>服务时长</span>
          <input id="orders-edit-duration-display" type="text" disabled />
        </label>
        <label class="mobile-form-field">
          <span>服务金额</span>
          <input id="orders-edit-service-amount" type="text" inputmode="decimal" placeholder="自动带出服务金额" disabled />
        </label>
        <label class="mobile-form-field" id="orders-edit-actual-amount-field">
          <span>实收金额</span>
          <input id="orders-edit-actual-amount" type="text" inputmode="decimal" placeholder="请输入实收金额" />
        </label>
        <label class="mobile-form-field" id="orders-edit-note-field">
          <span>备注</span>
          <textarea id="orders-edit-note" rows="4" placeholder="请输入订单备注"></textarea>
        </label>
        <p class="small" id="orders-edit-feedback" hidden></p>
        <div class="mobile-sheet-inline-actions">
          <button class="mobile-sheet-secondary danger" type="button" id="orders-edit-delete">删除订单</button>
          <button class="mobile-sheet-primary" type="button" id="orders-edit-submit">保存订单</button>
        </div>
      </div>
    </section>

    <section class="mobile-bottom-sheet" id="orders-detail-panel" hidden>
      <div class="mobile-sheet-handle"></div>
      <div class="mobile-sheet-head">
        <div>
          <h2>订单详情</h2>
          <p>用于查看服务与结算信息。</p>
        </div>
        <button class="merchant-mobile-icon-button" type="button" id="orders-detail-close" aria-label="关闭详情面板">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="mobile-sheet-body">
        <div class="mobile-sheet-records" id="orders-detail-items"></div>
        <div class="mobile-sheet-inline-actions" id="orders-detail-actions">
          <button class="mobile-sheet-secondary" type="button" id="orders-manage-button">管理订单</button>
          <button class="mobile-sheet-primary" type="button" id="orders-start-button">开始订单</button>
          <div class="orders-action-row" id="orders-end-extend-row" hidden>
            <button class="mobile-sheet-secondary" type="button" id="orders-end-button">结束订单</button>
            <button class="mobile-sheet-secondary" type="button" id="orders-extend-button">加钟</button>
          </div>
          <div class="orders-action-row" id="orders-delete-save-row" hidden>
            <button class="mobile-sheet-secondary danger" type="button" id="orders-detail-delete-button">删除订单</button>
            <button class="mobile-sheet-primary" type="button" id="orders-detail-save-button">保存订单</button>
          </div>
        </div>
      </div>
    </section>

    <section class="mobile-bottom-sheet" id="orders-settle-panel" hidden>
      <div class="mobile-sheet-handle"></div>
      <div class="mobile-sheet-head">
        <div>
          <h2>结算订单</h2>
          <p id="orders-settle-order-no">--</p>
        </div>
        <button class="merchant-mobile-icon-button" type="button" id="orders-settle-close" aria-label="关闭结算面板">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="mobile-sheet-body">
        <label class="mobile-form-field">
          <span>服务金额</span>
          <input id="orders-settle-service-amount" type="text" disabled />
        </label>
        <label class="mobile-form-field">
          <span>实收金额</span>
          <input id="orders-settle-actual-amount" type="text" inputmode="decimal" placeholder="默认按服务金额结算，可手动修改" />
        </label>
        <label class="mobile-form-field">
          <span>备注</span>
          <textarea id="orders-settle-note" rows="2" placeholder="结算备注（选填）"></textarea>
        </label>
        <p class="small" id="orders-settle-feedback" hidden></p>
        <div class="mobile-sheet-inline-actions">
          <button class="mobile-sheet-secondary" type="button" id="orders-settle-cancel">取消</button>
          <button class="mobile-sheet-primary" type="button" id="orders-settle-confirm">确认结算</button>
        </div>
      </div>
    </section>

    <nav class="merchant-bottom-nav-mobile" aria-label="商家端底部导航">
      <a class="nav-item" href="./merchant-dashboard.html">
        <span class="material-symbols-outlined">grid_view</span>
        <span>工作台</span>
      </a>
      <a class="nav-item active" href="./merchant-orders.html">
        <span class="material-symbols-outlined">receipt_long</span>
        <span>订单</span>
      </a>
      <a class="nav-item" href="./merchant-technicians.html">
        <span class="material-symbols-outlined">groups</span>
        <span>技师</span>
      </a>
      <a class="nav-item" href="./merchant-settings.html">
        <span class="material-symbols-outlined">storefront</span>
        <span>店铺</span>
      </a>
    </nav>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
