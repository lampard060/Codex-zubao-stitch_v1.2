<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>我的收益 - 足宝</title>
<link rel="stylesheet" href="./fonts/fonts.css" />
<link rel="stylesheet" href="./styles.css?v=20260515-redesign" />
<script defer src="./js/icon-fallback-inline.js?v=20260516-iconfix7"></script>
<link rel="stylesheet" href="./technician-redesign.css?v=20260519-order-total" />
</head>
<body data-page="technician-earnings">
<div class="technician-app-shell">
  <div class="technician-topbar" id="technician-topbar"></div>

  <main class="technician-page technician-earnings-page">
    <div class="tech-segmented" id="time-tab">
      <button class="tech-segmented-pill" data-period="today" type="button">今日</button>
      <button class="tech-segmented-pill active" data-period="month" type="button">本月</button>
      <button class="tech-segmented-pill" data-period="salary" type="button">工资</button>
      <button class="tech-segmented-pill" data-period="year" type="button">年度</button>
    </div>

    <section class="earnings-total-block" aria-labelledby="earnings-label">
      <p class="earnings-kicker" id="earnings-label">累计收益</p>
      <h1 class="earnings-total" id="earnings-total">¥12,450.00</h1>
      <p class="earnings-trend" id="earnings-trend">
        <span class="material-symbols-outlined">trending_up</span>
        较上月增长 15%
      </p>
    </section>

    <section class="earnings-metric-row" aria-label="收益统计">
      <article class="earnings-metric-card">
        <span class="earnings-metric-label">完成订单</span>
        <strong id="earnings-orders">142</strong>
      </article>
      <article class="earnings-metric-card">
        <span class="earnings-metric-label" id="earnings-amount-label">服务总额</span>
        <strong id="earnings-amount">¥87.6</strong>
      </article>
    </section>

    <section class="tech-section">
      <div class="tech-section-head">
        <h2>收益趋势</h2>
        <span class="material-symbols-outlined section-chart-icon">monitoring</span>
      </div>
      <div class="earnings-chart-card">
        <div class="earnings-chart-bars" id="earnings-chart"></div>
      </div>
    </section>

    <section class="tech-section">
      <div class="tech-section-head">
        <h2>最近明细</h2>
        <a href="#" id="view-all-details" class="tech-subtle-link">查看全部</a>
      </div>
      <div class="earnings-detail-list" id="earnings-details"></div>
    </section>
  </main>

  <div class="technician-bottom-nav-mobile" id="technician-bottom-nav"></div>
</div>

<script type="module" src="./js/pages/technician-earnings.js?v=20260519-order-total"></script>
</body>
</html>
