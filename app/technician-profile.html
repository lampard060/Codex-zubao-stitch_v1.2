<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>我的 - 足宝</title>
<link rel="stylesheet" href="./fonts/fonts.css" />
<link rel="stylesheet" href="./styles.css?v=20260515-redesign" />
<script defer src="./js/icon-fallback-inline.js?v=20260514-icons"></script>
<link rel="stylesheet" href="./technician-redesign.css?v=20260603-modal-scroll" />
</head>
<body data-page="technician-profile">
<div class="technician-app-shell">
  <div class="technician-topbar" id="technician-topbar"></div>

  <main class="technician-page technician-profile-page">
    <section class="profile-identity">
      <div class="profile-avatar-shell">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBg93Afg2MS-RSPyZPJGQRHsstIRFFOpGiMO1c4-BuDGqYrEPQEsb3F2gkURVdQ2iCpB_0AxtWIzgY7AlW1t4lj3mnlfgkO5TVY5g4e-kbAFlsFxzNEDVp0ZaNws1T7IXgce-MPHl2lXs438UFO9FPlHYk8P1Ku3odlRf0oHp5zX-xwQyhoWw52OzjAf1IRPLpCJMmaZ--d07pVIuwQxxQa6QTzX_4_HBeuyWZ3AuFM3tlOe-Cgi-r9UMF74m6p2v4ik2L35t8QPvv2" alt="技师头像" class="profile-avatar-large" id="profile-avatar" />
      </div>
      <div class="profile-identity-copy">
        <h1 class="profile-name" id="profile-name">Elena Rostova</h1>
        <div class="profile-badge-row">
          <span class="profile-number" id="profile-number">ID: 8842</span>
          <span class="profile-rating-pill">
            <span class="material-symbols-outlined">star</span>
            <span id="profile-rating-chip">4.9</span>
          </span>
        </div>
        <p class="profile-bio" id="profile-bio">专注身心愈合，以指尖传递宁静的力量。</p>
      </div>
    </section>

    <section class="profile-stat-grid" aria-label="技师统计">
      <article class="profile-stat-card">
        <strong id="stat-hours">1,240</strong>
        <span id="stat-primary-label">累计单数</span>
        <span class="sr-only" id="stat-primary-unit">单</span>
      </article>
      <article class="profile-stat-card">
        <strong id="stat-rating">4.98</strong>
        <span>客户评分</span>
      </article>
    </section>

    <section class="profile-shop-card hidden" id="shop-card">
      <p class="profile-card-label">当前门店</p>
      <div class="profile-shop-content">
        <div class="profile-shop-icon">
          <span class="material-symbols-outlined">storefront</span>
        </div>
        <div>
          <h2 id="shop-name">Zen Spa Downtown</h2>
          <p id="shop-area">128 Lotus Avenue, Financial District</p>
          <p class="profile-shop-schedule" id="shop-schedule">
            <span class="material-symbols-outlined">schedule</span>
            今日：10:00 - 20:00
          </p>
        </div>
      </div>
      <button class="tech-primary-button" id="shop-detail-btn" type="button">查看门店详情</button>
    </section>

    <section class="profile-menu-panel" aria-label="个人中心菜单">
      <a href="./technician-membership-history.html" class="profile-menu-item">
        <span class="material-symbols-outlined">history</span>
        <span>服务历史</span>
        <span class="material-symbols-outlined menu-chevron">chevron_right</span>
      </a>
      <a href="#" class="profile-menu-item">
        <span class="material-symbols-outlined">info</span>
        <span>关于足宝</span>
        <span class="material-symbols-outlined menu-chevron">chevron_right</span>
      </a>
    </section>

    <div class="profile-action-hidden" aria-hidden="true">
      <button id="edit-profile-btn" type="button">编辑资料</button>
      <button id="avatar-edit-btn" type="button">上传照片</button>
      <button id="terminate-btn" type="button">申请解约</button>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settings-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>设置</h3>
          <button class="modal-close" id="modal-close-btn" type="button">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="modal-body">
          <button class="modal-menu-item" id="modal-edit-profile" type="button">
            <span class="material-symbols-outlined">edit</span>
            <span>资料编辑</span>
          </button>
          <button class="modal-menu-item modal-menu-danger" id="modal-logout" type="button">
            <span class="material-symbols-outlined">logout</span>
            <span>退出登录</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 资料编辑弹窗 -->
    <div class="modal-overlay" id="edit-profile-modal">
      <div class="modal-content modal-content-full">
        <div class="modal-header">
          <h3>编辑资料</h3>
          <button class="modal-close" id="edit-modal-close-btn" type="button">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="edit-avatar-section">
            <div class="edit-avatar-wrapper">
              <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBg93Afg2MS-RSPyZPJGQRHsstIRFFOpGiMO1c4-BuDGqYrEPQEsb3F2gkURVdQ2iCpB_0AxtWIzgY7AlW1t4lj3mnlfgkO5TVY5g4e-kbAFlsFxzNEDVp0ZaNws1T7IXgce-MPHl2lXs438UFO9FPlHYk8P1Ku3odlRf0oHp5zX-xwQyhoWw52OzjAf1IRPLpCJMmaZ--d07pVIuwQxxQa6QTzX_4_HBeuyWZ3AuFM3tlOe-Cgi-r9UMF74m6p2v4ik2L35t8QPvv2" alt="技师头像" class="edit-avatar-img" id="edit-avatar-img" />
              <button class="edit-avatar-btn" id="change-avatar-btn" type="button">
                <span class="material-symbols-outlined">camera_alt</span>
              </button>
            </div>
          </div>
          <form class="edit-form" id="edit-profile-form">
            <div class="edit-form-group">
              <label for="edit-name">姓名</label>
              <input type="text" id="edit-name" name="name" value="Elena Rostova" placeholder="请输入姓名" />
            </div>
            <div class="edit-form-row">
              <div class="edit-form-group edit-form-group-half">
                <label for="edit-gender">性别</label>
                <select id="edit-gender" name="gender">
                  <option value="">请选择</option>
                  <option value="male">男</option>
                  <option value="female">女</option>
                </select>
              </div>
              <div class="edit-form-group edit-form-group-half">
                <label for="edit-birthday">出生年月</label>
                <input type="date" id="edit-birthday" name="birthday" placeholder="请选择出生年月" />
              </div>
            </div>
            <div class="edit-form-group">
              <label for="edit-phone">手机号</label>
              <input type="tel" id="edit-phone" name="phone" value="138****8888" placeholder="请输入手机号" />
            </div>
            <div class="edit-form-group">
              <label for="edit-skills">擅长项目</label>
              <input type="text" id="edit-skills" name="skills" value="足底按摩、中式推拿、经络疏通" placeholder="请输入擅长项目，用顿号分隔" />
            </div>
            <div class="edit-form-group">
              <label for="edit-bio">个人简介</label>
              <textarea id="edit-bio" name="bio" rows="3" placeholder="请输入个人简介">专注身心愈合，以指尖传递宁静的力量。</textarea>
            </div>
            <div class="edit-form-actions">
              <button type="button" class="btn-outline" id="edit-cancel-btn">取消</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div class="technician-bottom-nav-mobile" id="technician-bottom-nav"></div>
</div>

<script type="module" src="./js/pages/technician-profile.js?v=20260603-modal-unified-scroll"></script>
</body>
</html>
