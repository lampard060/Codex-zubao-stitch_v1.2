<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>技师工作台 - 足宝</title>
<link rel="stylesheet" href="./fonts/fonts.css" />
<link rel="stylesheet" href="./styles.css?v=20260515-redesign" />
<script defer src="./js/icon-fallback-inline.js?v=20260514-icons"></script>
<link rel="stylesheet" href="./technician-redesign.css?v=20260603-homehero1" />
</head>
<body data-page="technician-home">
<div class="technician-app-shell">
  <div class="technician-topbar" id="technician-topbar"></div>

  <main class="technician-page technician-home-page">
    <section class="home-hero-card" id="home-hero-section" style="display: none;"></section>

    <section class="home-stat-grid" aria-label="今日概览" id="stat-grid-section" style="display: none;">
      <article class="home-stat-card">
        <div class="stat-icon">
          <span class="material-symbols-outlined">receipt</span>
        </div>
        <div class="stat-content">
          <span class="stat-label">今日单数</span>
          <strong class="stat-value" id="today-orders">0</strong>
        </div>
      </article>
      <article class="home-stat-card">
        <div class="stat-icon">
          <span class="material-symbols-outlined">account_balance_wallet</span>
        </div>
        <div class="stat-content">
          <span class="stat-label">预估收益</span>
          <strong class="stat-value">¥<span id="today-income">0</span></strong>
        </div>
      </article>
    </section>

    <div class="home-current-task" id="task-section"></div>

    <section class="home-current-orders-section" id="current-orders-section" style="display: none;">
      <div class="section-header">
        <h2>当前任务</h2>
      </div>
      <div class="current-orders-list" id="current-orders-container"></div>
    </section>

    <section class="home-orders-section" id="completed-orders-section" style="display: none;">
      <div class="section-header">
        <h2>今日已完成订单</h2>
        <a href="#" class="view-all">查看全部 <span class="material-symbols-outlined">chevron_right</span></a>
      </div>
      <div class="orders-list" id="completed-orders-container"></div>
    </section>

    <section class="home-checkout-section" id="checkout-section" style="display: none;">
      <button class="btn-outline" id="attendance-btn" type="button">
        <span class="material-symbols-outlined">logout</span>
        下班打卡
      </button>
    </section>
  </main>

  <div class="technician-bottom-nav-mobile" id="technician-bottom-nav"></div>
</div>

<script type="module" src="./js/pages/technician-home.js?v=20260603-homehero1"></script>
</body>
</html>
