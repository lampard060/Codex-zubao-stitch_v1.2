<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>足宝 | 会员管理</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
  <link rel="stylesheet" href="./styles.css?v=20260429a" />
  </head>
  <body data-page="merchant-members">
    <div class="app-shell merchant-subpage-shell">
      <main class="main-panel merchant-subpage-main">
        <header class="merchant-subpage-topbar">
          <div class="merchant-subpage-topbar-left">
            <a class="merchant-back-button" href="./merchant-settings.html" aria-label="返回店铺页">
              <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <h1>会员管理</h1>
          </div>
          <img class="merchant-subpage-avatar" src="./zubao-tech-icon.png" alt="足宝图标" />
        </header>

        <button class="merchant-add-tile member-add-btn-top" type="button" id="member-create-toggle">
          <span class="merchant-add-icon">
            <span class="material-symbols-outlined">add</span>
          </span>
          <span>新增会员</span>
        </button>

        <section class="merchant-search-panel">
          <label class="merchant-search-field">
            <span class="material-symbols-outlined">search</span>
            <input id="member-search-input" placeholder="搜索姓名或手机号..." autocomplete="off" />
          </label>
          <div class="merchant-filter-row">
            <button class="merchant-chip-button" type="button" id="member-level-filter">
              <span class="material-symbols-outlined">filter_list</span>
              <span>会员等级</span>
            </button>
            <button class="merchant-chip-button" type="button" id="member-date-filter">
              <span class="material-symbols-outlined">calendar_month</span>
              <span>注册日期</span>
            </button>
          </div>
        </section>

        <section class="merchant-subpage-stack" id="member-list"></section>
      </main>
    </div>

    <div class="mobile-sheet-backdrop" id="member-sheet-backdrop" hidden></div>

    <section class="mobile-bottom-sheet" id="member-detail-panel" hidden>
      <div class="mobile-sheet-handle"></div>
      <div class="mobile-sheet-head">
        <div>
          <h2>会员档案</h2>
          <p>查看并维护客户会员资料。</p>
        </div>
        <button class="merchant-mobile-icon-button" type="button" id="member-detail-close" aria-label="关闭会员弹层">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="mobile-sheet-body">
        
        <label class="mobile-form-field">
          <span>客户姓名</span>
          <input id="member-name-input" placeholder="请输入客户姓名" />
        </label>
        <label class="mobile-form-field">
          <span>联系电话</span>
          <input id="member-phone-input" type="tel" inputmode="tel" placeholder="请输入联系电话" />
        </label>
        <label class="mobile-form-field">
          <span>性别</span>
          <select id="member-gender-input">
            <option value="">未设置</option>
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
        </label>
        <label class="mobile-form-field">
          <span>会员等级</span>
          <select id="member-level-input">
            <option value="1">普通会员</option>
            <option value="2">青铜会员</option>
            <option value="3">白银会员</option>
            <option value="4">黄金会员</option>
            <option value="5">铂金会员</option>
            <option value="6">钻石会员</option>
          </select>
        </label>
        <label class="mobile-form-field">
          <span>备注</span>
          <textarea id="member-note-input" rows="4" placeholder="请输入客户备注"></textarea>
        </label>
        <div class="member-stats-section" id="member-stats-display">
          <div class="member-stat">
            <span class="member-stat-label">累计消费</span>
            <span class="member-stat-value" id="member-total-spent">¥0.00</span>
          </div>
          <div class="member-stat">
            <span class="member-stat-label">累计充值</span>
            <span class="member-stat-value" id="member-total-recharged">¥0.00</span>
          </div>
        </div>
        <p class="small" id="member-feedback" hidden></p>
        <div class="mobile-sheet-inline-actions" id="member-edit-actions">
          <button class="mobile-sheet-secondary danger" type="button" id="member-toggle-button">删除会员</button>
          <button class="mobile-sheet-primary" type="button" id="member-save-button">保存资料</button>
        </div>
        <button class="mobile-sheet-primary" type="button" id="member-create-button" hidden>保存资料</button>
      </div>
    </section>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
