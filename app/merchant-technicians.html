<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>足宝 | 技师协作</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles.css?v=20260428a" />
  </head>
  <body data-page="merchant-technicians">
    <div class="app-shell merchant-mobile-shell">
      <main class="main-panel merchant-mobile-main">
        <header class="topbar merchant-mobile-topbar">
          <div class="merchant-mobile-titlebar">
            <img class="merchant-mobile-logo-badge" src="./zubao-tech-icon.png" alt="足宝图标" />
            <h1 class="merchant-mobile-title">技师协作</h1>
          </div>

        </header>

        <section class="mobile-hero-card mobile-hero-card-emerald technician-hero-card" id="technician-settlement-card">
          <div class="mobile-hero-head">
            <span class="mobile-hero-label">工资与结算摘要</span>
            <button class="mobile-hero-arrow" type="button" aria-label="查看详情">
              <span class="material-symbols-outlined">chevron_right</span>
            </button>
          </div>
          <div class="mobile-hero-amount" id="technician-settlement-total">¥24,850.00</div>
          <p class="mobile-hero-note">本月累计结算金额</p>
          <div class="mobile-settlement-grid">
            <article class="mobile-settlement-card">
              <span>待结算</span>
              <strong id="technician-settlement-pending">¥1,240</strong>
            </article>
            <article class="mobile-settlement-card">
              <span>已入账</span>
              <strong id="technician-settlement-paid">¥23,610</strong>
            </article>
          </div>
        </section>

        <section class="mobile-tab-shell" id="technician-status-filters">
          <button class="mobile-tab-pill active" data-technician-status-filter="in_service">服务中</button>
          <button class="mobile-tab-pill" data-technician-status-filter="scheduled">排钟</button>
          <button class="mobile-tab-pill" data-technician-status-filter="resting">休息</button>
          <button class="mobile-tab-pill" data-technician-status-filter="all">全部技师</button>
        </section>

        <section class="mobile-section">
          <div class="mobile-card-stack" id="technician-grid">
            <article class="mobile-technician-row">
              <div class="mobile-technician-main">
                <div class="merchant-mobile-avatar theme-coral">林</div>
                <div class="mobile-technician-copy">
                  <h3>林晓月</h3>
                  <div class="mobile-technician-meta">
                    <span class="mobile-status-pill success">待命</span>
                    <span>工号: #082</span>
                  </div>
                </div>
              </div>
              <label class="mobile-switch">
                <input type="checkbox" checked />
                <span></span>
              </label>
            </article>
          </div>
        </section>

        <section class="mobile-section">
          <article class="mobile-star-card">
            <div class="mobile-star-head">
              <span class="mobile-star-title">今日服务之星</span>
            </div>
            <div class="mobile-star-body">
              <div class="mobile-star-profile">
                <div class="merchant-mobile-avatar theme-bronze large" id="technician-star-avatar">林</div>
                <div>
                  <h3 id="technician-star-name">林晓月</h3>
                  <p id="technician-star-rating">★★★★★ 4.9</p>
                </div>
              </div>
              <div class="mobile-star-side">
                <span>今日订单</span>
                <strong id="technician-star-orders">12</strong>
              </div>
            </div>
          </article>
        </section>
      </main>
    </div>

    <div class="mobile-sheet-backdrop" id="technician-sheet-backdrop" hidden></div>

    <section class="mobile-bottom-sheet" id="technician-detail-panel" hidden>
      <div class="mobile-sheet-handle"></div>
      <div class="mobile-sheet-head">
        <div>
          <h2>技师详情</h2>
          <p id="technician-focus-copy">快速查看当前在店技师的服务信息。</p>
        </div>
        <button class="merchant-mobile-icon-button" type="button" id="technician-detail-close" aria-label="关闭详情">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="mobile-sheet-body">
        <div class="mobile-sheet-records" id="technician-detail-info"></div>
        <div class="mobile-sheet-records" id="technician-detail-performance"></div>
      </div>
    </section>

    <section class="mobile-bottom-sheet" id="applications" hidden>
      <div class="mobile-sheet-handle"></div>
      <div class="mobile-sheet-head">
        <div>
          <h2 id="application-title">待处理申请</h2>
          <p>审批通过后可进入门店待排班池。</p>
        </div>
        <button class="merchant-mobile-icon-button" type="button" id="technician-applications-close" aria-label="关闭申请列表">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="mobile-sheet-body">
        <div class="mobile-card-stack" id="application-list"></div>
      </div>
    </section>

    <nav class="merchant-bottom-nav-mobile" aria-label="商家端底部导航">
      <a class="nav-item" href="./merchant-dashboard.html">
        <span class="material-symbols-outlined">grid_view</span>
        <span>工作台</span>
      </a>
      <a class="nav-item" href="./merchant-orders.html">
        <span class="material-symbols-outlined">receipt_long</span>
        <span>订单</span>
      </a>
      <a class="nav-item active" href="./merchant-technicians.html">
        <span class="material-symbols-outlined">groups</span>
        <span>技师</span>
      </a>
      <a class="nav-item" href="./merchant-settings.html">
        <span class="material-symbols-outlined">storefront</span>
        <span>店铺</span>
      </a>
    </nav>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
